<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento da Sala</title>

    <link rel="stylesheet" href="css/agendamento.css">
</head>

<body>

    <main class="container-agendamento">

        <a href="index.html" class="btn-voltar">
            ← Voltar
        </a>

        <header>
            <h1>Agendamento da Sala</h1>
            <p>Preencha seus dados e escolha um horário disponível.</p>
        </header>

        <form id="formAgendamento">

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >
            </div>


            <div class="campo">
                <label for="data">Data</label>

                <input
                    type="date"
                    id="data"
                    name="data"
                    required
                >
            </div>

            <section class="area-horarios" id="areaHorarios">

                <h2>Horários disponíveis</h2>

                <div
                    class="horarios"
                    id="horarios"
                ></div>

            </section>

            <button
                type="submit"
                class="btn-confirmar"
                id="btnConfirmar"
                disabled
            >
                Confirmar agendamento
            </button>

        </form>

    </main>

    <div id="modalConfirmar" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <p id="modalConfirmarTexto"></p>
        <div class="modal-botoes">
            <button id="modalConfirmarSim" class="btn-confirmar-sim">Sim</button>
            <button id="modalConfirmarNao" class="btn-confirmar-nao">Cancelar</button>
        </div>
    </div>
</div>

    <div
        class="modal"
        id="modalConfirmacao"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModal"
    >

        <div class="modal-conteudo">

            <div class="icone-sucesso">✓</div>

            <h2 id="tituloModal">
                Agendamento confirmado!
            </h2>

            <p id="mensagemAgendamento"></p>

            <button
                type="button"
                class="btn-modal"
                id="fecharModal"
            >
                Fechar
            </button>

        </div>

    </div>

    <script src="js/agendamento.js"></script>

</body>

</html>
